<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form action="" method="post">
        <legend>1. Datos del Viajero/a</legend>
            <label for="name">Nombre Completo</label>
            <input type="text" id="name">
            <label for="correoelectronico">Correo electrónico</label>
            <input type="email" id="correoelectronico"> 
            <label for="tel">Teléfono</label>
            <input type="tel" id="tel" pattern="[0-9]{9}"> 
            <label for="fechanacimiento">Fecha de Nacimiento</label>
            <input type="date" id="fechanacimiento" max="2008-10-13"> 
            <label for="contrasena">Elige una Contraseña</label>
            <input type="password" id="contrasena">  
    </form>
        <form action="" method="post">
        <legend>2. Datos del viaje</legend>

            <label for="despegue">Fecha de despegue</label>
            <input type="date" id="despegue" min="2026-10-14">
            <label for="pasajeros">Número de pasajeros/as</label>
            <input type="number" id="pasajeros" min="1" max="4"> 
            <label for="clasecabina">Clase de cabina</label>
            <select name="clasecabina" id="clasecabina">
                <option value="">Elige una Opcion</option>
                <option value="clasico">Economica</option>
                <option value="ligero">Business</option>
                <option value="premium">Suite con vistas</option> 
            
                <fieldset>
                <legend> Turno preferido</legend>
                <input type="radio" id="clasico" name="turno">
                <label for="clasico">Clasico</label>
                <input type="radio" id="ligero" name="turno">
                <label for="tligero">Ligero</label>
                <input type="radio" id="premium" name="turno">
                <label for="premium">Premium</label>
            </fieldset> 
            <label for="destino">Destino del paseo lunar</label>
            <input type="text" id="destino">  
    </form>

    
</body>
</html>
